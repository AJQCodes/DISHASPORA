# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Database (PostgreSQL) ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/dishaspora
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────────────────────────────────────
dishaspora.jwt.secret=DishasporaSecretKeyForJWT2026KNUSTGroup12CodeQuestSuperSecure
dishaspora.jwt.expiration=86400000

# ── App ───────────────────────────────────────────────────────────────────────
dishaspora.app.name=Dishaspora
dishaspora.app.version=1.0.0

